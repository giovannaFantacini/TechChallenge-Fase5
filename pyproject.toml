[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-offers"
version = "1.0.0"
description = "Plataforma de experimentação adaptativa (multi-armed bandits) para próxima melhor ação em canais digitais — Datathon POSTECH MLET Fase 5"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.4",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "mlflow>=2.14",
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "requests>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "jupyter>=1.0", "ipykernel>=6.29", "nbformat>=5.10"]
kaggle = ["kagglehub>=0.3"]

[project.scripts]
adaptive-offers = "adaptive_offers.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
